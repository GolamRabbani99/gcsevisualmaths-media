name: fetch-audio
on:
  push:
    paths: ["fetch/urls.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed files
        run: |
          mkdir -p fetched
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -o "fetched/$name" "$url"
          done < fetch/urls.txt
      - name: Commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add fetched
          git commit -m "Fetched audio" || exit 0
          git push
